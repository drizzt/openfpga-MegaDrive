# pocket: no upstream counterpart. The workflows pin actions by SHA, so something has
# to bump them.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Composite actions are not covered by the "/" entry; they need their own.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/build-core"
    schedule:
      interval: "weekly"
