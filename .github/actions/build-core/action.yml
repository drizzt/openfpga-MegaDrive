name: Build core
description: >-
  Check package consistency, assemble the loader, compile the Quartus project,
  reverse the bitstream and upload the timing and Quartus reports.

# pocket: no upstream counterpart, agg23 inlines these steps in its build workflow.
# Factored out here because two workflows run the same build, and timing is read per
# variant since this core ships two bitstreams.
#
# A composite action rather than a reusable workflow, so the release job can run
# these steps inline in a checkout it already owns and commits back to.

runs:
  using: composite
  steps:
    # Seconds, and independent of everything below: fail before the slow parts.
    - name: Check package consistency
      shell: bash
      run: scripts/check_packages.sh

    # build.sh owns the Quartus image pin and calls build_loader.sh and
    # deploy_bitstream.sh itself. CONTAINER_RUNTIME: it defaults to podman for
    # local use, hosted runners only ship docker
    - name: Compile
      shell: bash
      env:
        CONTAINER_RUNTIME: docker
      run: scripts/build.sh

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: reports
        path: build_output/reports/
