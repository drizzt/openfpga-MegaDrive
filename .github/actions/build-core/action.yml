name: Build core
description: >-
  Check package consistency, compile the Quartus project, reverse the bitstream
  and upload the timing and Quartus reports.

# The build steps live here once instead of being repeated in every workflow.
# A composite action (rather than a reusable workflow) so the release job can run
# the same steps inline, in a checkout it already owns and commits back to.

runs:
  using: composite
  steps:
    # Seconds, and independent of everything below: fail before the slow parts.
    - name: Check package consistency
      shell: bash
      run: scripts/check_packages.sh

    # build.sh owns the Quartus image pin and calls deploy_bitstream.sh itself.
    - name: Compile
      shell: bash
      run: scripts/build.sh

    # Always: a failed compile still leaves an .sta.summary worth reporting, and
    # the timing gate needs the file to exist either way. `|| true` because the
    # gate job owns the verdict; this step only has to produce the report.
    - name: Check timing against baseline
      if: always()
      shell: bash
      run: scripts/check_timing_regression.sh projects/output_files/ap_core.sta.summary timing_baseline.txt timing.txt || true

    - name: Upload timing report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: timing
        path: timing.txt

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: reports
        path: |
          projects/output_files/ap_core.fit.summary
          projects/output_files/ap_core.fit.rpt
          projects/output_files/ap_core.sta.summary
          projects/output_files/ap_core.sta.rpt
          projects/output_files/ap_core.flow.rpt
          build_output/reports/
